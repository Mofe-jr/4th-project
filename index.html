<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Custom Web Player</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configure Tailwind -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#8b5cf6', // Electric Purple
              hover: '#a78bfa',
              dark: '#5b21b6'
            },
            surface: {
              base: '#121212', // Main background
              elevated: '#181818', // Cards, sidebar
              highlight: '#282828', // Hover state
            }
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-black text-white h-screen flex flex-col font-sans overflow-hidden selec-none">

  <!-- Main App Layout (Top Part before Playback Bar) -->
  <div class="flex-1 flex overflow-hidden p-2 gap-2 h-[calc(100vh-90px)]">
    
    <!-- Left Sidebar -->
    <nav id="sidebar" class="w-64 bg-surface-elevated rounded-lg flex flex-col overflow-hidden">
      <!-- Main Nav -->
      <div class="p-4 space-y-4 font-semibold">
        <a href="#" class="flex items-center gap-4 text-gray-300 hover:text-white transition group">
          <i data-lucide="home" class="w-6 h-6 transition group-hover:text-white"></i>
          Home
        </a>
        <a href="#" class="flex items-center gap-4 text-gray-300 hover:text-white transition group">
          <i data-lucide="search" class="w-6 h-6 transition group-hover:text-white"></i>
          Search
        </a>
      </div>

      <!-- Library Section -->
      <div class="flex-1 flex flex-col mt-2 px-2 pb-2 overflow-hidden">
        <div class="flex items-center justify-between p-2 text-gray-300 hover:text-white transition cursor-pointer">
          <div class="flex items-center gap-2 font-semibold">
            <i data-lucide="library" class="w-6 h-6"></i>
            Your Library
          </div>
          <button class="hover:bg-surface-highlight p-1 rounded-full"><i data-lucide="plus" class="w-4 h-4"></i></button>
        </div>
        
        <!-- Filter Pills -->
        <div class="flex gap-2 p-2 mt-2">
          <span class="text-sm bg-surface-highlight hover:bg-gray-700 px-3 py-1 rounded-full cursor-pointer transition">Playlists</span>
          <span class="text-sm bg-surface-highlight hover:bg-gray-700 px-3 py-1 rounded-full cursor-pointer transition">Artists</span>
        </div>

        <!-- Scrollable Playlists -->
        <div id="sidebar-playlists" class="flex-1 overflow-y-auto mt-2 space-y-2 custom-scrollbar pr-1">
          <!-- Populated by JS -->
        </div>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main id="main-content" class="flex-1 bg-surface-base rounded-lg relative overflow-y-auto custom-scrollbar bg-gradient-to-b from-brand-dark/40 to-surface-base pb-24">
      
      <!-- Sticky Top Header -->
      <header class="sticky top-0 z-10 flex items-center justify-between px-6 py-4 bg-surface-base/80 backdrop-blur-md">
        <!-- Navigation Arrows -->
        <div class="flex gap-2">
          <button class="bg-black/50 hover:bg-black p-2 rounded-full text-gray-300 hover:text-white transition">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
          </button>
          <button class="bg-black/50 hover:bg-black p-2 rounded-full text-gray-300 hover:text-white transition">
            <i data-lucide="chevron-right" class="w-5 h-5"></i>
          </button>
        </div>
        <!-- Profile / Account -->
        <div class="flex items-center gap-2">
          <button class="bg-white text-black font-bold px-4 py-1.5 rounded-full text-sm hover:scale-105 transition">Explore Premium</button>
          <button class="bg-black/50 hover:bg-black p-2 rounded-full text-gray-300 hover:text-white transition">
            <i data-lucide="bell" class="w-5 h-5"></i>
          </button>
          <button class="bg-black p-1 rounded-full text-gray-300 hover:text-white transition border border-gray-700">
            <img src="https://i.pravatar.cc/150?u=user1" alt="Profile" class="w-7 h-7 rounded-full" />
          </button>
        </div>
      </header>

      <!-- Content -->
      <div class="px-6 relative z-0">
        <h1 id="greeting" class="text-3xl font-bold mt-4 mb-6">Good evening</h1>
        
        <!-- Featured Grid -->
        <div id="featured-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
          <!-- Populated by JS -->
        </div>

        <div class="flex items-end justify-between mb-4">
          <h2 class="text-2xl font-bold hover:underline cursor-pointer">Jump back in</h2>
          <span class="text-sm text-gray-400 font-semibold hover:underline cursor-pointer">Show all</span>
        </div>

        <!-- Horizontal Scroll Cards -->
        <div id="recently-played" class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-4 pb-8">
          <!-- Populated by JS -->
        </div>
      </div>
    </main>
    
    <!-- Lyrics Panel (Hidden by default) -->
    <aside id="lyrics-panel" class="w-80 bg-surface-elevated rounded-lg flex-col overflow-hidden hidden transition-all duration-300">
      <div class="p-4 border-b border-surface-highlight flex justify-between items-center bg-surface-elevated sticky top-0 z-10">
        <h2 class="font-bold text-lg">Lyrics</h2>
        <button id="btn-close-lyrics" class="text-gray-400 hover:text-white transition"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="lyrics-content" class="p-6 overflow-y-auto custom-scrollbar flex-1 text-lg leading-relaxed font-semibold text-gray-200">
        <!-- Lyrics injected here -->
        Loading lyrics...
      </div>
    </aside>
  </div>

  <!-- Bottom Playback Bar -->
  <footer id="player-bar" class="h-[90px] bg-black px-4 flex items-center justify-between border-t border-surface-highlight fixed bottom-0 w-full z-50">
    
    <!-- Now Playing Info -->
    <div class="flex items-center w-[30%] min-w-[180px] gap-4">
      <img id="current-album-art" src="https://ui-avatars.com/api/?name=Music&background=282828&color=fff" class="h-14 w-14 rounded shadow" alt="Album Art" />
      <div class="flex flex-col justify-center">
        <a id="current-title" href="#" class="text-sm font-semibold hover:underline line-clamp-1">Song Title</a>
        <a id="current-artist" href="#" class="text-xs text-gray-400 hover:underline hover:text-white line-clamp-1">Artist Name</a>
      </div>
      <button id="btn-fav" class="text-gray-400 hover:text-brand transition ml-2">
        <i data-lucide="heart" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Player Controls -->
    <div class="flex flex-col items-center max-w-[45%] w-full">
      <div class="flex items-center gap-6 mb-1">
        <button class="text-gray-400 hover:text-white transition"><i data-lucide="shuffle" class="w-4 h-4"></i></button>
        <button id="btn-prev" class="text-gray-400 hover:text-white transition"><i data-lucide="skip-back" class="w-5 h-5 fill-current border-0"></i></button>
        <button id="btn-play" class="bg-white text-black rounded-full p-2 hover:scale-105 transition hover:bg-gray-200">
          <i data-lucide="play" class="w-5 h-5 fill-current ml-0.5"></i>
        </button>
        <button id="btn-next" class="text-gray-400 hover:text-white transition"><i data-lucide="skip-forward" class="w-5 h-5 fill-current border-0"></i></button>
        <button id="btn-repeat" class="text-gray-400 hover:text-white transition"><i data-lucide="repeat" class="w-4 h-4"></i></button>
      </div>
      <!-- Scrubber -->
      <div class="flex items-center gap-2 w-full text-xs text-gray-400">
        <span id="time-current">0:00</span>
        <div class="relative w-full h-1 group cursor-pointer flex items-center" id="progress-container">
          <div class="absolute w-full h-1 bg-surface-highlight rounded-full overflow-hidden">
             <div id="progress-bar" class="h-full bg-white group-hover:bg-brand rounded-full" style="width: 0%"></div>
          </div>
          <!-- Scrubber Thumb (visible strictly on hover) -->
          <div id="progress-thumb" class="absolute h-3 w-3 bg-white rounded-full shadow hidden group-hover:block transition" style="left: 0%; transform: translateX(-50%);"></div>
        </div>
        <span id="time-total">0:00</span>
      </div>
    </div>

    <!-- Extra Controls -->
    <div class="flex items-center justify-end w-[30%] min-w-[180px] gap-3 text-gray-400">
      <button id="btn-speed" class="hover:text-white transition font-bold text-xs border border-gray-600 hover:border-gray-400 rounded px-1 min-w-[28px]">1x</button>
      <button id="btn-lyrics" class="hover:text-white transition"><i data-lucide="mic-2" class="w-4 h-4"></i></button>
      <button class="hover:text-white transition"><i data-lucide="list-music" class="w-4 h-4"></i></button>
      <button class="hover:text-white transition"><i data-lucide="laptop-2" class="w-4 h-4"></i></button>
      <div class="flex items-center gap-2 group w-24">
        <button class="hover:text-white transition"><i data-lucide="volume-2" class="w-4 h-4"></i></button>
        <div class="relative w-full h-1 group cursor-pointer flex items-center" id="volume-container">
          <div class="absolute w-full h-1 bg-surface-highlight rounded-full overflow-hidden">
             <div id="volume-bar" class="h-full bg-white group-hover:bg-brand rounded-full" style="width: 100%"></div>
          </div>
          <div class="absolute h-3 w-3 bg-white rounded-full shadow hidden group-hover:block transition" style="left: 100%; transform: translateX(-50%);"></div>
        </div>
      </div>
      <button class="hover:text-white transition"><i data-lucide="maximize-2" class="w-4 h-4"></i></button>
    </div>
  </footer>

  <!-- Invisible Audio Element -->
  <audio id="audio-player"></audio>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
